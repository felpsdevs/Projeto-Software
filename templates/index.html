<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tarefas</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="form-container">
        <h1 class="header-title">Gerenciador de Tarefas</h1>
        
        <form action="{{ url_for('add') }}" method="POST">
            <input type="text" name="task" placeholder="Digite uma nova tarefa" required>
            <input type="submit" value="Adicionar">
        </form>
    </div>

    <div class="task-container"> 
        <ul>
            {% for task in tasks %}
            <li class="task-item {% if task['completed'] %}completed-task{% endif %}">
                {{ task['name'] }}
                {% if not task['completed'] %}
                <form action="{{ url_for('concluir_tarefa', task_id=task['id']) }}" method="POST" style="display:inline;">
                    <input type="submit" value="Concluir">
                </form>
                {% else %}
                <span>Concluída</span>
                {% endif %}
                <form action="{{ url_for('delete', task_id=task['id']) }}" method="POST" style="display:inline;">
                    <input type="submit" value="Excluir">
                </form>
            </li>
            {% endfor %}
        </ul>
    </div>

    <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
    
    <div class="date-time-toggle">
        <span class="date-time-icon">🕒</span>
        <span id="date-time"></span>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const savedTheme = localStorage.getItem('theme') || 'light-mode';
            document.body.classList.add(savedTheme);
            updateThemeIcon();
        });

        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            document.body.classList.toggle('light-mode');
            
            const currentTheme = document.body.classList.contains('dark-mode') ? 'dark-mode' : 'light-mode';
            localStorage.setItem('theme', currentTheme);
            updateThemeIcon();
        }

        function updateThemeIcon() {
            const themeToggleButton = document.querySelector('.theme-toggle');
            themeToggleButton.textContent = document.body.classList.contains('dark-mode') ? '🌞' : '🌙';
        }
    </script>

    <script>
        function updateDateTime() {
            const now = new Date();
            const dateOptions = { day: '2-digit', month: '2-digit', year: 'numeric' };
            const timeOptions = { hour: '2-digit', minute: '2-digit', second: '2-digit' };
            
            const date = now.toLocaleDateString('pt-BR', dateOptions);
            const time = now.toLocaleTimeString('pt-BR', timeOptions);
    
            document.getElementById('date-time').textContent = `${date} ${time}`;
        }
    
        setInterval(updateDateTime, 1000);
        updateDateTime();
    </script>
</body>
</html>
