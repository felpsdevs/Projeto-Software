<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tarefas</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="form-container">
        <h1 class="header-title">Gerenciador de Tarefas</h1>
        <form action="{{ url_for('add') }}" method="POST">
            <input type="text" name="task" placeholder="Digite uma nova tarefa" required>
            <input type="submit" value="Adicionar">
        </form>
    </div>

    <div class="task-container"> 
        <ul>
            {% for task in tasks %}
            <li class="task-item {% if task['completed'] %}completed-task{% endif %}">
                {{ task['name'] }}
                {% if not task['completed'] %}
                <form action="{{ url_for('concluir_tarefa', task_id=task['id']) }}" method="POST" style="display:inline;">
                    <input type="submit" value="Concluir">
                </form>
                {% else %}
                <span>Concluída</span>
                {% endif %}
                <form action="{{ url_for('delete', task_id=task['id']) }}" method="POST" style="display:inline;">
                    <input type="submit" value="Excluir">
                </form>
            </li>
            {% endfor %}
        </ul>
    </div>

    <!-- Botão de troca de tema -->
    <button class="theme-toggle" onclick="toggleTheme()">🌙</button>

    <!-- Script para manter o tema -->
    <script>
        // Verifica o tema salvo e aplica na página
        document.addEventListener('DOMContentLoaded', function () {
            const savedTheme = localStorage.getItem('theme') || 'light-mode';
            document.body.classList.add(savedTheme);

            // Atualiza o ícone do botão de tema conforme o modo
            updateThemeIcon();
        });

        // Função para alternar o tema e salvar no localStorage
        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            document.body.classList.toggle('light-mode');
            
            const currentTheme = document.body.classList.contains('dark-mode') ? 'dark-mode' : 'light-mode';
            localStorage.setItem('theme', currentTheme);

            // Atualiza o ícone do botão de tema
            updateThemeIcon();
        }

        // Função para atualizar o ícone do botão de tema
        function updateThemeIcon() {
            const themeToggleButton = document.querySelector('.theme-toggle');
            if (document.body.classList.contains('dark-mode')) {
                themeToggleButton.textContent = '🌞';
            } else {
                themeToggleButton.textContent = '🌙';
            }
        }
    </script>
</body>
</html>
